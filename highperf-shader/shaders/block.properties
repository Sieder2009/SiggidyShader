# ===========================================================================
# Notwendige Begleitdatei für gbuffers_terrain.vsh/.fsh UND gbuffers_water.vsh/.fsh
#
# Ohne diese Datei liefert das Vertex-Attribut "mc_Entity.x" für ALLE Blöcke
# den Wert -1.0 - weder die Wind- noch die Wasser-Erkennung im Shader würde
# dann greifen. Die IDs hier müssen exakt zu den #define ID_WATER/ID_FOLIAGE/
# ID_LEAVES in gbuffers_terrain.vsh/.fsh bzw. gbuffers_water.vsh/.fsh passen.
#
# WICHTIG: block.1001 (Wasser) wird von gbuffers_water.fsh gebraucht, um
# echtes Wasser von ANDEREM transluzentem Material zu unterscheiden - Iris/
# OptiFine schicken NICHT nur Wasser durch gbuffers_water, sondern die
# gesamte transluzente Ebene (Eis, Glas, Blattglas, Schleim/Honig,
# Nether-Portal, ...). Ohne diese Unterscheidung würde z. B. Glas fälschlich
# wie dunkles Wasser aussehen.
# ===========================================================================

block.1001=minecraft:water

block.1002=minecraft:short_grass minecraft:tall_grass minecraft:fern minecraft:large_fern \
  minecraft:dandelion minecraft:poppy minecraft:blue_orchid minecraft:allium \
  minecraft:azure_bluet minecraft:red_tulip minecraft:orange_tulip minecraft:white_tulip \
  minecraft:pink_tulip minecraft:oxeye_daisy minecraft:cornflower minecraft:lily_of_the_valley \
  minecraft:sunflower minecraft:lilac minecraft:rose_bush minecraft:peony \
  minecraft:wheat minecraft:carrots minecraft:potatoes minecraft:beetroots

block.1003=minecraft:oak_leaves minecraft:spruce_leaves minecraft:birch_leaves \
  minecraft:jungle_leaves minecraft:acacia_leaves minecraft:dark_oak_leaves \
  minecraft:mangrove_leaves minecraft:azalea_leaves minecraft:flowering_azalea_leaves \
  minecraft:cherry_leaves

# ---------------------------------------------------------------------------
# Farbige Lichtquellen (Colored Block Emission) - jede Zeile eine eigene ID,
# damit gbuffers_terrain.fsh jedem Lichtquellen-Typ seine eigene Glühfarbe
# geben kann, statt (wie vorher) alle Lichtquellen gleich warm-orange zu
# färben. Die IDs müssen exakt zu den ID_EMIT_*-#defines in
# gbuffers_terrain.fsh passen (nur die Fragment-Stufe braucht sie, die
# Vertex-Stufe reicht die rohe Block-ID nur unverändert durch).
# ":eigenschaft=wert" filtert auf einen bestimmten Blockstate (z. B. nur die
# "an"-Variante) - block.properties nutzt dafür einen Doppelpunkt, NICHT die
# eckigen Klammern aus /setblock-Befehlen.
# ---------------------------------------------------------------------------

block.1010=minecraft:torch minecraft:wall_torch minecraft:lantern
block.1011=minecraft:soul_torch minecraft:soul_wall_torch minecraft:soul_lantern
block.1012=minecraft:glowstone minecraft:shroomlight
block.1013=minecraft:lava minecraft:magma_block
block.1014=minecraft:redstone_torch:lit=true minecraft:redstone_wall_torch:lit=true \
  minecraft:redstone_lamp:lit=true
block.1015=minecraft:sea_lantern
block.1016=minecraft:verdant_froglight
block.1017=minecraft:ochre_froglight
block.1018=minecraft:pearlescent_froglight
block.1019=minecraft:amethyst_cluster minecraft:large_amethyst_bud \
  minecraft:medium_amethyst_bud minecraft:small_amethyst_bud

# ---------------------------------------------------------------------------
# Erde/Sand/Kies <-> Stein: weicher Übergang, siehe applyTerrainTransition()
# in composite.fsh. Zwei Kategorien - der Übergang triggert NUR zwischen
# diesen beiden, nicht zu irgendwelchen anderen Blöcken (Gras, Holz, ...).
# Bewusst nur die "vollen" Basisblöcke gelistet, keine Stufen/Treppen/Mauern
# (das wären eigene Block-IDs, für den Umfang dieser Datei zu viele).
# ---------------------------------------------------------------------------

block.1030=minecraft:dirt minecraft:coarse_dirt minecraft:podzol minecraft:mycelium \
  minecraft:rooted_dirt minecraft:sand minecraft:red_sand minecraft:gravel

block.1031=minecraft:stone minecraft:cobblestone minecraft:mossy_cobblestone \
  minecraft:andesite minecraft:diorite minecraft:granite \
  minecraft:polished_andesite minecraft:polished_diorite minecraft:polished_granite \
  minecraft:deepslate minecraft:cobbled_deepslate minecraft:polished_deepslate \
  minecraft:tuff minecraft:calcite minecraft:stone_bricks minecraft:mossy_stone_bricks \
  minecraft:cracked_stone_bricks minecraft:chiseled_stone_bricks minecraft:smooth_stone \
  minecraft:sandstone minecraft:red_sandstone minecraft:blackstone minecraft:basalt \
  minecraft:smooth_basalt
