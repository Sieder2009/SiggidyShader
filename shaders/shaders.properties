# ===========================================================================
# Aurora Nights - shader options
#
# Minecraft Java Edition 26.3 (Iris / OptiFine)
#
# Most visual settings (star density/brightness, wave height, shadow
# softness, exposure, saturation, bloom, vignette ...) are declared as
# #define / const values with an inline "// [choice list]" directly in the
# GLSL source files. Iris and OptiFine both scan the shader source for these
# and turn them into sliders/dropdowns automatically under:
#   Video Settings > Shaders > Shader Options
# No additional wiring is required here for those.
#
# The "Profile" dropdown below picks a whole performance tier at once
# (shadow quality/distance, clouds, light shafts, bloom, antialiasing). "Medium" matches
# the plain file defaults. Picking a profile only changes the performance-
# relevant options above; purely cosmetic sliders (colors, wave height,
# star brightness, exposure, ...) are left alone so they can still be tuned
# independently of the chosen tier.
# ===========================================================================

# Render both faces of geometry into the shadow map instead of just the
# back faces. Costs a little performance but removes "peter-panning"
# (shadows detaching from thin objects like leaves, fences, etc).
shadow.culling=false

# Performance profiles. Bare NAME / !NAME toggles a boolean #define
# (SHADOW_ENABLED, ENABLE_CLOUDS, VOLUMETRIC_CLOUDS, CLOUD_SHADOWS,
# ENABLE_AURORA, WAVING_PLANTS, WATER_SKY_REFLECTION, WATER_FOG,
# SCREEN_SPACE_REFLECTIONS, REFLECTIVE_BLOCKS, RAIN_PUDDLES, SSAO,
# LIGHT_SHAFTS, ENABLE_BLOOM, TEMPORAL_AA, ENABLE_FXAA are all declared as
# valueless #defines in the GLSL, tested with #ifdef);
# NAME=value sets a valued #define/const (SHADOW_QUALITY, shadowMapResolution,
# shadowDistance, LIGHT_SHAFT_SAMPLES). A profile only changes the options it
# lists, so every performance option appears in all four lines.
    profile.POTATO = !SHADOW_ENABLED SHADOW_QUALITY=0 shadowMapResolution=1024 shadowDistance=64.0  !ENABLE_CLOUDS !VOLUMETRIC_CLOUDS !CLOUD_SHADOWS !ENABLE_AURORA !WAVING_PLANTS !WATER_SKY_REFLECTION !WATER_FOG !SCREEN_SPACE_REFLECTIONS !REFLECTIVE_BLOCKS !RAIN_PUDDLES !SSAO !LIGHT_SHAFTS LIGHT_SHAFT_SAMPLES=6  !ENABLE_BLOOM !TEMPORAL_AA !ENABLE_FXAA
    profile.LOW    =  SHADOW_ENABLED SHADOW_QUALITY=0 shadowMapResolution=1024 shadowDistance=96.0   ENABLE_CLOUDS !VOLUMETRIC_CLOUDS !CLOUD_SHADOWS !ENABLE_AURORA  WAVING_PLANTS  WATER_SKY_REFLECTION  WATER_FOG !SCREEN_SPACE_REFLECTIONS  REFLECTIVE_BLOCKS  RAIN_PUDDLES !SSAO !LIGHT_SHAFTS LIGHT_SHAFT_SAMPLES=6  !ENABLE_BLOOM !TEMPORAL_AA !ENABLE_FXAA
    profile.MEDIUM =  SHADOW_ENABLED SHADOW_QUALITY=1 shadowMapResolution=2048 shadowDistance=160.0  ENABLE_CLOUDS  VOLUMETRIC_CLOUDS  CLOUD_SHADOWS  ENABLE_AURORA  WAVING_PLANTS  WATER_SKY_REFLECTION  WATER_FOG  SCREEN_SPACE_REFLECTIONS  REFLECTIVE_BLOCKS  RAIN_PUDDLES  SSAO  LIGHT_SHAFTS LIGHT_SHAFT_SAMPLES=8   ENABLE_BLOOM  TEMPORAL_AA !ENABLE_FXAA
    profile.HIGH   =  SHADOW_ENABLED SHADOW_QUALITY=2 shadowMapResolution=3072 shadowDistance=200.0  ENABLE_CLOUDS  VOLUMETRIC_CLOUDS  CLOUD_SHADOWS  ENABLE_AURORA  WAVING_PLANTS  WATER_SKY_REFLECTION  WATER_FOG  SCREEN_SPACE_REFLECTIONS  REFLECTIVE_BLOCKS  RAIN_PUDDLES  SSAO  LIGHT_SHAFTS LIGHT_SHAFT_SAMPLES=12  ENABLE_BLOOM  TEMPORAL_AA !ENABLE_FXAA

# Fully skip the shadow map render pass when shadows are turned off (via the
# Potato profile, or by hand in the shader options) instead of just hiding
# their effect - this is the single biggest performance lever for weak GPUs.
program.shadow.enabled=SHADOW_ENABLED
# The End has its own shadow program (shaders/world1/), which the line above
# does not cover - without this one, Potato still rendered the full shadow
# map there. (The Nether, world-1/, has no shadow program at all.)
program.world1/shadow.enabled=SHADOW_ENABLED

# The ambient occlusion pass (deferred.fsh) costs a full screen of depth
# lookups; skip it entirely when SSAO is off (deferred1.fsh then doesn't
# read its result either). Every dimension folder has its own copy.
program.deferred.enabled=SSAO
program.world-1/deferred.enabled=SSAO
program.world1/deferred.enabled=SSAO

# Same for the TAA pass (composite2.fsh) and TEMPORAL_AA.
program.composite2.enabled=TEMPORAL_AA
program.world-1/composite2.enabled=TEMPORAL_AA
program.world1/composite2.enabled=TEMPORAL_AA

# Entities don't cast shadows on the cheapest shadow tier (Low profile, or
# SHADOW_QUALITY set to 0 by hand) as a smaller extra performance lever.
# This can't be set directly from inside a profile.* line above - profiles
# can only assign values to options actually registered from the GLSL source
# (a #define/const with a "// [list]" comment), and shadowEntities is a raw
# top-level Iris/OptiFine directive with no such registration - so instead,
# same as ComplementaryReimagined's own ENTITY_SHADOW/shadowEntities pair,
# it's applied here unconditionally, gated on the registered SHADOW_QUALITY
# option.
#if SHADOW_QUALITY == 0
    shadowEntities = false
#endif

# Aurora Nights paints its own sky/cloud layer in deferred1.fsh; hide
# vanilla's flat cloud plane so it can't float in front of/behind it.
clouds=off

# Vanilla darkens the screen edges itself; final.fsh already has its own,
# adjustable vignette (VIGNETTE_STRENGTH), so turn vanilla's off instead of
# stacking both.
vignette=false

# 1 while the player is in a biome where it actually rains (biome_precipitation:
# 0 = none, e.g. deserts, 1 = rain, 2 = snow), faded over a few seconds when
# walking from one biome into another. rainStrength is the same in every biome,
# so without this, deserts and snowfields would get wet ground, puddles and
# rainbows too. Read by common.glsl as  uniform float rainBiome.
uniform.float.rainBiome = smooth(1, if(biome_precipitation == 1, 1.0, 0.0), 10, 10)

# Vanilla bakes a fixed darkening per block face into the vertex colors
# (sides and undersides darker). Aurora Nights lights faces itself - the
# sun by its real direction, sky and torch light with faceShade() in
# common.glsl - so turn vanilla's off instead of applying both.
oldLighting=false

# colortex2 holds normals and material codes for the post passes (see the
# top of common.glsl). It must never be alpha-blended: a half-transparent
# water or entity pixel would otherwise average two normals into garbage.
# (These names apply to the programs in every dimension folder.)
blend.gbuffers_terrain.colortex2=off
blend.gbuffers_entities.colortex2=off
blend.gbuffers_hand.colortex2=off
blend.gbuffers_water.colortex2=off
