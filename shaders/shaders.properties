# ===========================================================================
# Aurora Nights - shader options
#
# Minecraft Java Edition 26.3 (Iris / OptiFine)
#
# Most visual settings (star density/brightness, wave height, shadow
# softness, exposure, saturation, bloom, vignette ...) are declared as
# #define / const values with an inline "// [choice list]" directly in the
# GLSL source files. Iris and OptiFine both scan the shader source for these
# and turn them into sliders/dropdowns automatically under:
#   Video Settings > Shaders > Shader Options
# No additional wiring is required here for those.
#
# The "Profile" dropdown below picks a whole performance tier at once
# (shadow quality/distance, clouds, bloom, antialiasing). "Medium" matches
# the plain file defaults. Picking a profile only changes the performance-
# relevant options above; purely cosmetic sliders (colors, wave height,
# star brightness, exposure, ...) are left alone so they can still be tuned
# independently of the chosen tier.
# ===========================================================================

# Render both faces of geometry into the shadow map instead of just the
# back faces. Costs a little performance but removes "peter-panning"
# (shadows detaching from thin objects like leaves, fences, etc).
shadow.culling=false

# Performance profiles. Bare NAME / !NAME toggles a boolean #define
# (SHADOW_ENABLED, ENABLE_CLOUDS, ENABLE_AURORA, WAVING_PLANTS,
# WATER_SKY_REFLECTION, ENABLE_BLOOM, ENABLE_FXAA are all declared as
# valueless #defines in the GLSL, tested with #ifdef); NAME=value sets a
# valued #define/const (SHADOW_QUALITY, shadowMapResolution, shadowDistance).
    profile.POTATO = !SHADOW_ENABLED shadowMapResolution=1024 shadowDistance=64.0  !ENABLE_CLOUDS !ENABLE_AURORA !WAVING_PLANTS !WATER_SKY_REFLECTION !ENABLE_BLOOM !ENABLE_FXAA
    profile.LOW    = SHADOW_ENABLED  SHADOW_QUALITY=0 shadowMapResolution=1024 shadowDistance=96.0  ENABLE_CLOUDS !ENABLE_AURORA  WAVING_PLANTS  WATER_SKY_REFLECTION !ENABLE_BLOOM !ENABLE_FXAA
    profile.MEDIUM = SHADOW_ENABLED  SHADOW_QUALITY=1 shadowMapResolution=2048 shadowDistance=160.0 ENABLE_CLOUDS  ENABLE_AURORA  WAVING_PLANTS  WATER_SKY_REFLECTION  ENABLE_BLOOM  ENABLE_FXAA
    profile.HIGH   = SHADOW_ENABLED  SHADOW_QUALITY=2 shadowMapResolution=3072 shadowDistance=200.0 ENABLE_CLOUDS  ENABLE_AURORA  WAVING_PLANTS  WATER_SKY_REFLECTION  ENABLE_BLOOM  ENABLE_FXAA

# Fully skip the shadow map render pass when shadows are turned off (via the
# Potato profile, or by hand in the shader options) instead of just hiding
# their effect - this is the single biggest performance lever for weak GPUs.
program.shadow.enabled=SHADOW_ENABLED

# Entities don't cast shadows on the cheapest shadow tier (Low profile, or
# SHADOW_QUALITY set to 0 by hand) as a smaller extra performance lever.
# This can't be set directly from inside a profile.* line above - profiles
# can only assign values to options actually registered from the GLSL source
# (a #define/const with a "// [list]" comment), and shadowEntities is a raw
# top-level Iris/OptiFine directive with no such registration - so instead,
# same as ComplementaryReimagined's own ENTITY_SHADOW/shadowEntities pair,
# it's applied here unconditionally, gated on the registered SHADOW_QUALITY
# option.
#if SHADOW_QUALITY == 0
    shadowEntities = false
#endif

# Aurora Nights paints its own sky/cloud layer in composite.fsh; hide
# vanilla's flat cloud plane so it can't float in front of/behind it.
clouds=off
