# ===========================================================================
# Aurora Nights - block IDs
#
# Iris/OptiFine hand these numbers to the shaders as mc_Entity.x. The
# meaning of every ID is defined in lib/common.glsl (ID_PLANT, ID_LEAVES,
# ...) - keep both files in sync. Block names that don't exist in the
# running Minecraft version are simply ignored, so names from newer/older
# versions can safely be listed side by side. Modded blocks can be added to
# any line as  modid:block_name.
# ===========================================================================

# 100 - rooted ground plants: only the top edge sways, the base stays put
block.100=short_grass grass fern dead_bush bush short_dry_grass tall_dry_grass firefly_bush red_shrub \
    oak_sapling spruce_sapling birch_sapling jungle_sapling acacia_sapling dark_oak_sapling cherry_sapling pale_oak_sapling poplar_sapling \
    dandelion golden_dandelion poppy blue_orchid allium azure_bluet red_tulip orange_tulip white_tulip pink_tulip oxeye_daisy cornflower lily_of_the_valley wither_rose torchflower open_eyeblossom closed_eyeblossom cactus_flower \
    wheat carrots potatoes beetroots torchflower_crop sweet_berry_bush \
    crimson_roots warped_roots nether_sprouts \
    tall_grass:half=lower large_fern:half=lower sunflower:half=lower lilac:half=lower rose_bush:half=lower peony:half=lower pitcher_plant:half=lower

# 101 - upper half of two-block-tall plants: sways twice as far at the tip,
#       and its lower edge follows the top of the lower half exactly
block.101=tall_grass:half=upper large_fern:half=upper sunflower:half=upper lilac:half=upper rose_bush:half=upper peony:half=upper pitcher_plant:half=upper

# 102 - leaves: the whole block sways gently
block.102=oak_leaves spruce_leaves birch_leaves jungle_leaves acacia_leaves dark_oak_leaves mangrove_leaves cherry_leaves pale_oak_leaves red_poplar_leaves orange_poplar_leaves yellow_poplar_leaves azalea_leaves flowering_azalea_leaves

# 103 - lit like foliage (soft, two-sided) but must NOT move: hangs from or
#       clings to other blocks, so swaying would detach it
block.103=vine glow_lichen hanging_roots mangrove_propagule seagrass tall_seagrass kelp kelp_plant weeping_vines weeping_vines_plant twisting_vines twisting_vines_plant cave_vines cave_vines_plant pale_hanging_moss sugar_cane cobweb

# 200 - the whole block glows
block.200=glowstone sea_lantern shroomlight ochre_froglight verdant_froglight pearlescent_froglight lava magma_block jack_o_lantern redstone_lamp:lit=true beacon crying_obsidian

# 201 - only the bright pixels glow (flames, lantern glass, ...)
block.201=torch wall_torch soul_torch soul_wall_torch copper_torch copper_wall_torch redstone_torch:lit=true redstone_wall_torch:lit=true \
    lantern soul_lantern copper_lantern exposed_copper_lantern weathered_copper_lantern oxidized_copper_lantern \
    waxed_copper_lantern waxed_exposed_copper_lantern waxed_weathered_copper_lantern waxed_oxidized_copper_lantern \
    fire soul_fire campfire:lit=true soul_campfire:lit=true end_rod

# 202 - Overworld ores: only the colored crystals glow, and only with the
#       GLOWING_ORES option (off by default). Nether ores are left out on
#       purpose - on red netherrack the "colorful pixels" rule would light
#       up the rock instead of the ore.
block.202=iron_ore deepslate_iron_ore copper_ore deepslate_copper_ore gold_ore deepslate_gold_ore \
    redstone_ore deepslate_redstone_ore lapis_ore deepslate_lapis_ore \
    emerald_ore deepslate_emerald_ore diamond_ore deepslate_diamond_ore

# 400-403 - shiny blocks for REFLECTIVE_BLOCKS (how shiny: shineOfBlock()
#           in common.glsl). Slabs, stairs and walls are listed with their
#           block, since they have the same surface.
# 400 - polished stone, quartz, prismarine bricks: a faint, soft sheen
block.400=polished_andesite polished_andesite_slab polished_andesite_stairs \
    polished_diorite polished_diorite_slab polished_diorite_stairs \
    polished_granite polished_granite_slab polished_granite_stairs \
    polished_deepslate polished_deepslate_slab polished_deepslate_stairs polished_deepslate_wall \
    polished_blackstone polished_blackstone_slab polished_blackstone_stairs polished_blackstone_wall \
    polished_tuff polished_tuff_slab polished_tuff_stairs polished_tuff_wall polished_basalt \
    smooth_stone smooth_stone_slab \
    quartz_block quartz_slab quartz_stairs smooth_quartz smooth_quartz_slab smooth_quartz_stairs quartz_pillar quartz_bricks chiseled_quartz_block \
    prismarine_bricks prismarine_brick_slab prismarine_brick_stairs dark_prismarine dark_prismarine_slab dark_prismarine_stairs

# 401 - clearly glossy: ice, obsidian, glazed terracotta
block.401=packed_ice blue_ice obsidian \
    white_glazed_terracotta orange_glazed_terracotta magenta_glazed_terracotta light_blue_glazed_terracotta yellow_glazed_terracotta lime_glazed_terracotta pink_glazed_terracotta gray_glazed_terracotta light_gray_glazed_terracotta cyan_glazed_terracotta purple_glazed_terracotta blue_glazed_terracotta brown_glazed_terracotta green_glazed_terracotta red_glazed_terracotta black_glazed_terracotta

# 402 - gem blocks: very shiny
block.402=diamond_block emerald_block amethyst_block

# 403 - metal: reflects in its own color
block.403=iron_block gold_block netherite_block \
    copper_block cut_copper cut_copper_slab cut_copper_stairs chiseled_copper \
    waxed_copper_block waxed_cut_copper waxed_cut_copper_slab waxed_cut_copper_stairs waxed_chiseled_copper \
    exposed_copper exposed_cut_copper exposed_cut_copper_slab exposed_cut_copper_stairs exposed_chiseled_copper \
    waxed_exposed_copper waxed_exposed_cut_copper waxed_exposed_cut_copper_slab waxed_exposed_cut_copper_stairs waxed_exposed_chiseled_copper \
    iron_door iron_trapdoor iron_bars chain iron_chain anvil chipped_anvil damaged_anvil cauldron water_cauldron \
    heavy_weighted_pressure_plate light_weighted_pressure_plate

# 300 - water (its own waves, sky mirror and transparency in gbuffers_water)
block.300=water
