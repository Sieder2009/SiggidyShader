# ===========================================================================
# Aurora Nights - block IDs
#
# Iris/OptiFine hand these numbers to the shaders as mc_Entity.x. The
# meaning of every ID is defined in lib/common.glsl (ID_PLANT, ID_LEAVES,
# ...) - keep both files in sync. Block names that don't exist in the
# running Minecraft version are simply ignored, so names from newer/older
# versions can safely be listed side by side. Modded blocks can be added to
# any line as  modid:block_name.
# ===========================================================================

# 100 - rooted ground plants: only the top edge sways, the base stays put
block.100=short_grass grass fern dead_bush bush short_dry_grass tall_dry_grass firefly_bush \
    oak_sapling spruce_sapling birch_sapling jungle_sapling acacia_sapling dark_oak_sapling cherry_sapling pale_oak_sapling \
    dandelion golden_dandelion poppy blue_orchid allium azure_bluet red_tulip orange_tulip white_tulip pink_tulip oxeye_daisy cornflower lily_of_the_valley wither_rose torchflower open_eyeblossom closed_eyeblossom cactus_flower \
    wheat carrots potatoes beetroots torchflower_crop sweet_berry_bush \
    crimson_roots warped_roots nether_sprouts \
    tall_grass:half=lower large_fern:half=lower sunflower:half=lower lilac:half=lower rose_bush:half=lower peony:half=lower pitcher_plant:half=lower

# 101 - upper half of two-block-tall plants: sways twice as far at the tip,
#       and its lower edge follows the top of the lower half exactly
block.101=tall_grass:half=upper large_fern:half=upper sunflower:half=upper lilac:half=upper rose_bush:half=upper peony:half=upper pitcher_plant:half=upper

# 102 - leaves: the whole block sways gently
block.102=oak_leaves spruce_leaves birch_leaves jungle_leaves acacia_leaves dark_oak_leaves mangrove_leaves cherry_leaves pale_oak_leaves azalea_leaves flowering_azalea_leaves

# 103 - lit like foliage (soft, two-sided) but must NOT move: hangs from or
#       clings to other blocks, so swaying would detach it
block.103=vine glow_lichen hanging_roots mangrove_propagule seagrass tall_seagrass kelp kelp_plantweeping_vines weeping_vines_plant twisting_vines twisting_vines_plant cave_vines cave_vines_plant pale_hanging_moss sugar_cane cobweb

# 200 - the whole block glows
block.200=glowstone sea_lantern shroomlight ochre_froglight verdant_froglight pearlescent_froglight lava magma_block jack_o_lantern redstone_lamp:lit=true beacon crying_obsidian

# 201 - only the bright pixels glow (flames, lantern glass, ...)
block.201=torch wall_torch soul_torch soul_wall_torch copper_torch copper_wall_torch redstone_torch:lit=true redstone_wall_torch:lit=true \
    lantern soul_lantern copper_lantern exposed_copper_lantern weathered_copper_lantern oxidized_copper_lantern \
    waxed_copper_lantern waxed_exposed_copper_lantern waxed_weathered_copper_lantern waxed_oxidized_copper_lantern \
    fire soul_fire campfire:lit=true soul_campfire:lit=true end_rod

# 300 - water (its own waves, sky mirror and transparency in gbuffers_water)
block.300=water
